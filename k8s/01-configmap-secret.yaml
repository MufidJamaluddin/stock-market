apiVersion: v1
kind: ConfigMap
metadata:
  name: stock-dashboard-config
  namespace: stock-dashboard
data:
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "stockdb"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  ES_URIS: "http://elasticsearch:9200"
  KAFKA_BOOTSTRAP: "kafka:29092"
  MARKET_GENERATOR_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: stock-dashboard-secret
  namespace: stock-dashboard
type: Opaque
# NOTE: these are demo/dev credentials, base64-encoded ("stock").
# Replace with real secrets (e.g. via a secret manager / sealed-secrets) before
# deploying anywhere beyond local development.
data:
  DB_USER: c3RvY2s=
  DB_PASSWORD: c3RvY2s=
