apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stock-dashboard-ingress
  namespace: stock-dashboard
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: stock-dashboard.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stock-dashboard-app
                port:
                  number: 80
